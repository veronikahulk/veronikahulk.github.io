<!doctype html><meta charset=utf-8><body>recv<script>
addEventListener('message',e=>{const d=e.data;if(!d||!d.name)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.text],{type:'text/plain'}));a.download=d.name;document.body.appendChild(a);a.click();e.source.postMessage({ok:d.name,len:d.text.length},'*')});parent.postMessage({ready:1},'*')
</script>
